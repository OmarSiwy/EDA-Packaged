name: build

# Builds every packaged tool and pushes the results to cachix, so that entering the
# template's nix shell is a download rather than a Rust and Zig compile.
on:
  push:
    branches: [main]
  pull_request:
  # Inputs are pinned in flake.lock, so a commit to cktImg or DeSpice does not reach
  # anyone until the lock moves. update.yml bumps it nightly; this catches the rebuild.
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            # netgen comes from here already built; without this line CI would compile it.
            extra-substituters = https://openlane.cachix.org
            extra-trusted-public-keys = openlane.cachix.org-1:qqdwh+QMNGmZAuyeQJTH9ErW57OWSvdtuwfBKdS254E=

      - uses: cachix/cachix-action@v15
        with:
          name: omarsiwy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # Pull requests from forks cannot read the secret. Build anyway, just do not push.
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build all packages
        run: nix build .#all --print-build-logs

      # A package that builds but does not run is the failure mode worth catching here:
      # the cache would happily serve it to everyone.
      - name: Smoke test
        run: |
          set -euo pipefail

          nix build .#cktimg -o result-cktimg
          ./result-cktimg/bin/cktimg-json --help > /dev/null
          echo "cktimg-json ok"

          # netgen builds green while being fatally broken: its Makefile pipes through
          # `tee` and returns tee's status, so a missing tclnetgen.so ships silently.
          # Running it is the only check that catches that.
          nix build .#netgen -o result-netgen
          if echo "quit" | ./result-netgen/bin/netgen -batch 2>&1 | grep -qi "couldn't load file"; then
            echo "netgen cannot load its Tcl module"; exit 1
          fi
          echo "netgen ok"

          # `nix shell .#spicerack` does NOT work: it is a buildPythonPackage, so it
          # exports no bin/ and nothing sets PYTHONPATH. Importing it the way Analog.nix
          # actually does is the only test that reflects the consumer. testbenches is
          # checked too: it is a subpackage rather than a sibling now, and the reason that
          # move happened is that the sibling was silently not installed at all.
          SPICERACK=$(nix build .#spicerack --no-link --print-out-paths)
          PYTHONPATH="$SPICERACK/lib/python3.12/site-packages" \
            nix run nixpkgs#python312 -- -c \
            'import spicerack, spicerack.testbenches; print("spicerack ok")'

          # --help alone would pass on a binary that cannot solve anything, and ESPice
          # previously built green while being unrunnable, so solve a real deck.
          nix build .#espice -o result-espice
          printf '* divider\nV1 vin 0 DC 10\nR1 vin vout 2k\nR2 vout 0 1k\n.op\n.end\n' > /tmp/div.sp
          # 2>&1 because espice writes its run summary to stderr; piping stdout alone
          # greps an empty stream and the check fails on a working binary.
          ./result-espice/bin/espice /tmp/div.sp --format=print 2>&1 | grep -q "Operating Point"
          echo "espice ok"

          nix build .#vera -o result-vera
          ./result-vera/bin/vera --help > /dev/null
          echo "vera ok"

          # Place a real two-transistor mirror. --help would pass on a philis that
          # cannot find its own rule decks, which is the failure mode worth catching:
          # `run` takes a deck as a required argument and the package ships them.
          nix build .#philis -o result-philis
          ls result-philis/share/philis/pdks/sky130.json > /dev/null
          printf '.subckt mirror vb out gnd\nM1 vb vb gnd gnd sky130_fd_pr__nfet_01v8 w=2u l=0.15u\nM2 out vb gnd gnd sky130_fd_pr__nfet_01v8 w=2u l=0.15u\n.ends\n.end\n' > /tmp/mirror.sp
          ./result-philis/bin/philis run /tmp/mirror.sp \
            result-philis/share/philis/pdks/sky130.json -o /tmp/pnr 2>&1 | tail -1
          ls /tmp/pnr/mirror.gds > /dev/null
          echo "philis ok"

          nix build .#openvaf -o result-openvaf
          ./result-openvaf/bin/openvaf-r --help > /dev/null
          echo "openvaf ok"

          # vacask builds green with zero device models if upstream's OSDI install rules
          # do not fire, and then every deck dies at its first `load`. Only checking that
          # lib/vacask/mod is populated catches that.
          nix build .#vacask -o result-vacask
          ls result-vacask/lib/vacask/mod/*.osdi > /dev/null
          echo "vacask ok"
